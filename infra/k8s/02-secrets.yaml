# Valores de ejemplo para desarrollo/demostración — en un cluster real esto
# se reemplaza por un External Secrets Operator apuntando a Vault (ver
# infra/vault/README.md), nunca por un Secret en texto plano en git.
apiVersion: v1
kind: Secret
metadata:
  name: itinerarios-secrets
  namespace: itinerarios
type: Opaque
stringData:
  JWT_SECRET_KEY: "dev-secret-change-me"
  OAUTH2_CLIENT_SECRET: "dev-client-secret-change-me"
  ITINERARY_DB_PASSWORD: "itinerary-db-pass"
  VAULT_TOKEN: "dev-only-token"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  DEMO_USER: "viajero"
  DEMO_PASSWORD: "viajero123"
