apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: itinerarios
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: itinerarios/api-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: itinerarios-config }
          env:
            - { name: JWT_SECRET_KEY, valueFrom: { secretKeyRef: { name: itinerarios-secrets, key: JWT_SECRET_KEY } } }
            - { name: DEMO_USER, valueFrom: { secretKeyRef: { name: itinerarios-secrets, key: DEMO_USER } } }
            - { name: DEMO_PASSWORD, valueFrom: { secretKeyRef: { name: itinerarios-secrets, key: DEMO_PASSWORD } } }
          ports:
            - { containerPort: 8000, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: itinerarios
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
