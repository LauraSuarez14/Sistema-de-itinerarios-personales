# El notification-bridge no es "serverless" en sí — es el puente mínimo
# entre RabbitMQ y las funciones Lambda de LocalStack (ver README sección 5).
# No necesita Service (no recibe tráfico entrante salvo /health y /metrics).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-bridge
  namespace: itinerarios
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-bridge }
  template:
    metadata:
      labels: { app: notification-bridge }
    spec:
      containers:
        - name: notification-bridge
          image: itinerarios/notification-bridge:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: itinerarios-config }
          env:
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: itinerarios-secrets, key: AWS_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: itinerarios-secrets, key: AWS_SECRET_ACCESS_KEY } } }
          ports:
            - { containerPort: 8090, name: http }
          readinessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-bridge
  namespace: itinerarios
spec:
  selector: { app: notification-bridge }
  ports: [{ name: http, port: 8090, targetPort: 8090 }]
