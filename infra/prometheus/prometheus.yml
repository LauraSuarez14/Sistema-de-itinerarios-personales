global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: airport-service
    metrics_path: /metrics
    static_configs:
      - targets: ["airport-service:8001"]

  - job_name: itinerary-service
    metrics_path: /metrics
    static_configs:
      - targets: ["itinerary-service:8002"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: notification-bridge
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-bridge:8003"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
