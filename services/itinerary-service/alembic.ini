[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# La URL real se construye en runtime dentro de alembic/env.py a partir de
# las variables de entorno ITINERARY_DB_*, para no duplicar credenciales
# aqui ni depender de que exista un .env en el working directory del build.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
