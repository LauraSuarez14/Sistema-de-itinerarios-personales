server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular Router usa el History API (rutas /map, /itineraries): cualquier
  # ruta que no exista como archivo estático cae de vuelta a index.html para
  # que el router del lado del cliente la resuelva.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
